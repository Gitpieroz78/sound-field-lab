<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Field Lab — Guide</title>
<style>
/* Sound Field Lab guide — same tokens as the app; light by default, dark by system or toggle. Offline, no external assets. */
:root {
  --bg: #f3f2ee; --panel: #ffffff; --ink: #1b1d1f; --muted: #62676d; --line: #dedbd3; --accent: #1f5fbf; --accent-ink: #fff;
  --chip: #ecebe6; --pos: #1a9c4b; --neg: #d6322a; --hero: #0e1012; --hero-ink: #eef0f2; --hero-muted: #a6adb4;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1012; --panel: #16191c; --ink: #e8eaec; --muted: #9aa1a8; --line: #2a2f35; --accent: #7fb0ff; --accent-ink: #0e1012;
  --chip: #22272c; --pos: #3ddc84; --neg: #ff5a52; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1012; --panel: #16191c; --ink: #e8eaec; --muted: #9aa1a8; --line: #2a2f35; --accent: #7fb0ff; --accent-ink: #0e1012;
  --chip: #22272c; --pos: #3ddc84; --neg: #ff5a52; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
a { color: var(--accent); }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

/* hero */
.hero { position: relative; background: var(--hero); color: var(--hero-ink); overflow: hidden; }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .9; }
.hero .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(14,16,18,.92) 0%, rgba(14,16,18,.65) 45%, rgba(14,16,18,.05) 100%); }
.hero .wrap { position: relative; padding-block: 28px 64px; }
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 64px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -.01em; }
.brand svg { color: #7fb0ff; }
.spacer { flex: 1; }
.langs { display: flex; gap: 2px; background: rgba(255,255,255,.08); border-radius: 999px; padding: 3px; }
.langs button { border: 0; background: transparent; color: var(--hero-muted); font: 600 12.5px system-ui, sans-serif; padding: 5px 10px; border-radius: 999px; cursor: pointer; }
.langs button[aria-pressed="true"] { background: #7fb0ff; color: #0e1012; }
.kicker { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #7fb0ff; font-weight: 650; }
h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(36px, 6vw, 64px); line-height: 1.04; letter-spacing: -.02em; margin: 14px 0 18px; max-width: 13em; text-wrap: balance; }
.lead { font-size: clamp(17px, 2vw, 20px); color: var(--hero-muted); max-width: 34em; margin: 0 0 28px; }
.cta { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 12px 20px; font-weight: 650; text-decoration: none; border: 1px solid transparent; }
.btn.main { background: #7fb0ff; color: #0e1012; }
.btn.ghost { border-color: rgba(255,255,255,.25); color: var(--hero-ink); }
.btn.solid { background: var(--accent); color: var(--accent-ink); }

/* sections */
section { padding-block: 64px 8px; }
h2 { font-family: var(--serif); font-weight: 600; font-size: clamp(28px, 3.6vw, 40px); line-height: 1.1; letter-spacing: -.015em; margin: 0 0 10px; text-wrap: balance; }
.sub { color: var(--muted); max-width: 40em; margin: 0 0 28px; font-size: 17px; }
.num { counter-reset: s; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.num li { list-style: none; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px 20px 22px; position: relative; }
.num li::before { counter-increment: s; content: counter(s); font: 600 34px/1 var(--serif); color: var(--accent); display: block; margin-bottom: 10px; }
.num { padding: 0; margin: 0; }
.views { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.view { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.view svg { width: 100%; height: 92px; display: block; margin-bottom: 10px; border-radius: 10px; background: var(--hero); }
.view b { display: block; margin-bottom: 4px; }
.view p { margin: 0; color: var(--muted); font-size: 14.5px; }
.exps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.exp { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px; display: flex; flex-direction: column; gap: 8px; }
.exp .tag { align-self: flex-start; font-size: 12.5px; font-weight: 650; color: var(--muted); background: var(--chip); border-radius: 999px; padding: 3px 10px; }
.exp h3 { font-family: var(--serif); font-weight: 600; font-size: 22px; line-height: 1.2; margin: 2px 0 0; }
.exp p { margin: 0; color: var(--muted); }
.exp a { margin-top: auto; align-self: flex-start; font-weight: 650; text-decoration: none; padding-top: 6px; }
.exp a:hover { text-decoration: underline; }
.tools { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tool { border-top: 3px solid var(--accent); background: var(--panel); border-radius: 0 0 14px 14px; padding: 14px 16px; }
.tool b { display: block; margin-bottom: 4px; }
.tool span { color: var(--muted); font-size: 14.5px; }
.keys { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 18px; color: var(--muted); font-size: 14.5px; }
kbd { font: 600 12.5px ui-monospace, Menlo, monospace; color: var(--ink); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 6px; background: var(--panel); }
.split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.note { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; }
.note h2 { font-size: 26px; }
.note p { color: var(--muted); margin: 0; }
.write { margin-top: 16px; background: var(--hero); color: var(--hero-ink); border-radius: 22px; padding: 30px 32px; display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
.write h2 { color: var(--hero-ink); margin: 0 0 6px; }
.write p { color: var(--hero-muted); margin: 0; max-width: 36em; }
.write .btn { margin-left: auto; }
footer { color: var(--muted); font-size: 13.5px; padding-block: 40px 48px; }
@media (max-width: 860px) {
  .views { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tools { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .num, .exps, .split, .tools { grid-template-columns: minmax(0, 1fr); }
  .top { margin-bottom: 36px; }
  .hero .shade { background: linear-gradient(180deg, rgba(14,16,18,.78) 0%, rgba(14,16,18,.6) 100%); }
  .write .btn { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
@media print {
  .hero canvas, .hero .shade, .langs, .cta { display: none; }
  .hero { background: none; color: #000; }
  .hero .wrap { padding-block: 0 10px; } .top { margin-bottom: 10px; }
  .lead, .kicker { color: #333; }
  section { padding-block: 18px 0; break-inside: avoid; }
  .exp, .view, .note, .tool, .num li { break-inside: avoid; border-color: #bbb; }
  .exp a { display: none; }
  .write { background: none; color: #000; border: 1px solid #bbb; } .write p, .write h2 { color: #000; } .write .btn { display: none; }
}
</style>
</head>

      </div>

    <div class="kicker" data-k="kicker"></div>

<main class="wrap">
  <section>

  <section>

    <div class="views" id="views"></div>
  </section>

  <section id="experiments">
    <h2 data-k="s3"></h2>
    <p class="sub" data-k="s3sub"></p>
    <div class="exps" id="exps"></div>
  </section>

  <section>
    <h2 data-k="s4"></h2>
    <p class="sub" data-k="s4sub"></p>
    <div class="tools" id="tools"></div>
    <div class="keys" id="keys"></div>
  </section>

  <section>
    <div class="split">

      <div class="note"><h2 data-k="s6"></h2><p data-k="s6txt"></p></div>
    </div>
    <div class="write">

    </div>
  </section>
</main>
<footer class="wrap" data-k="foot"></footer>

    fr: {
      kicker: 'Guide', h1: 'L’air ne voyage pas. L’onde, oui.',
      lead: 'Chaque point est une molécule d’air sur un million. Lancez l’animation et regardez-les osciller sur place pendant que le son s’éloigne de l’enceinte. Puis construisez des subs end-fire, des line arrays et des salles, et découvrez pourquoi ils fonctionnent.',
      open: 'Ouvrir le labo', try: 'Essayer une expérience',
      s1: 'Votre première minute', s1sub: 'Trois gestes, et le reste du labo prend tout son sens.',

      s5: 'Enregistrer, partager, enseigner', s5txt: 'Le menu Enregistrer crée une image avec légende, un lien qui rouvre exactement ce que vous voyez, ou un fichier de scène. Un cours peut être une liste de liens.',

      s7: 'Des idées ? Quelque chose ne va pas ?', s7txt: 'Écrivez au créateur : suggestions, erreurs de physique, bugs. Les messages arrivent sur la page publique du projet sur GitHub (un compte gratuit est nécessaire). Dans le labo, le bouton Écrivez-nous joint aussi la scène que vous regardez.',
      s7btn: 'Écrire au créateur',
      foot: 'Sound Field Lab — inspiré des animations d’acoustique de Dan Russell (Penn State), des simulations PhET et Falstad et du séminaire Meyer Sound avec Magu. Construit à partir de la physique, sans contenu de tiers, fonctionne hors ligne. Libre de copier, partager et modifier.',
      ex: {
        simple: ['1 kHz · source ponctuelle', 'Qu’est-ce qui bouge vraiment ?', 'Suivez la molécule rouge : d’avant en arrière, jamais plus loin. L’onde voyage, l’air reste.'],
        alley: ['2 subs · 63 Hz', 'Pourquoi le centre de la salle est-il si fort ?', 'Le même signal depuis deux subs : là où les chemins sont égaux ils s’additionnent, ailleurs un peigne de creux.'],
        gradient: ['Cardioïde · 63 Hz', 'Comment un sub peut-il se taire derrière ?', 'Le sub arrière est inversé et retardé : derrière la paire, les deux s’annulent. Regardez le diagramme polaire.'],

  const EXPS = ['simple', 'alley', 'gradient', 'pulse', 'arcdelay', 'jarray', 'tm', 'room', 'helium', 'dipole'];
  const $ = id => document.getElementById(id);
  // the lab is index.html on the website, sound-field-lab.html next to this file on disk
  const APP = location.protocol === 'file:' ? 'sound-field-lab.html' : './';

  // small pictures of the five views (drawn, not screenshots)
  const VIEWS = {
    mol: () => { let s = ''; let seed = 7; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      for (let i = 0; i < 170; i++) { const x = r() * 200, y = r() * 92, d = Math.hypot(x - 40, y - 46), p = Math.sin(d / 9); s += `<circle cx="${(x + 3 * Math.cos(d / 9)).toFixed(1)}" cy="${y.toFixed(1)}" r="1.6" fill="${p > 0 ? '#3ddc84' : '#ff5a52'}" opacity="${(0.25 + 0.75 * Math.abs(p)).toFixed(2)}"/>`; }
      return s + '<circle cx="40" cy="46" r="5" fill="#ff6b6b"/>'; },
    rip: () => { let s = ''; for (let i = 9; i > 0; i--) s += `<circle cx="40" cy="46" r="${i * 18}" fill="${i % 2 ? '#2f8f5b' : '#b8483f'}" opacity="${(0.25 + i * 0.07).toFixed(2)}"/>`; return s + '<circle cx="40" cy="46" r="5" fill="#ff6b6b"/>'; },
    spl: () => { const c = ['#2a3cff', '#3a8fe0', '#4fd1c0', '#7be05a', '#d8e04a', '#f0a030', '#e5402a']; let s = '';
      c.forEach((col, i) => { const k = 7 - i; s += `<ellipse cx="${30 + k * 9}" cy="46" rx="${k * 26}" ry="${k * 9}" fill="${col}"/>`; }); return s; },
    surf: () => { let s = ''; for (let j = 0; j < 9; j++) { let d = 'M'; for (let i = 0; i <= 40; i++) { const x = i * 5, y = 20 + j * 7 + Math.sin(i / 3 - j / 2) * (3 + j * 0.5); d += `${x},${y.toFixed(1)} `; } s += `<polyline points="${d.slice(1)}" fill="none" stroke="${j % 2 ? '#3ddc84' : '#ff5a52'}" stroke-width="1.2" opacity=".85"/>`; } return s; },
    block: () => '<g fill="none" stroke="#8a929b" stroke-width="1.2"><path d="M100 10 L160 40 L160 80 L100 90 L40 80 L40 40 Z"/><path d="M100 50 L160 40 M100 50 L40 40 M100 50 L100 90"/></g>' +
      '<g fill="none" stroke-width="2"><path d="M100 50 m -18 9 a 20 12 0 0 1 36 0" stroke="#3ddc84"/><path d="M100 50 m -34 17 a 38 22 0 0 1 68 0" stroke="#ff5a52"/></g><circle cx="100" cy="50" r="4" fill="#ff6b6b"/>',
  };

  function render(l) {
    const t = T[l] || T.en;
    document.documentElement.lang = l;
    document.title = 'Sound Field Lab — ' + t.kicker;
    document.querySelectorAll('[data-k]').forEach(el => { const v = t[el.dataset.k]; if (v != null) el.innerHTML = v; });
    document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === l)));
    document.querySelectorAll('a.app').forEach(a => { a.href = APP + '#l=' + l; });
    $('views').innerHTML = ['mol', 'rip', 'spl', 'surf', 'block'].map(k =>
      `<div class="view"><svg viewBox="0 0 200 92" aria-hidden="true">${VIEWS[k]()}</svg><b>${t['v_' + k]}</b><p>${t['v_' + k + '_t']}</p></div>`).join('');
    $('exps').innerHTML = EXPS.map(id => { const e = t.ex[id];
      return `<article class="exp"><span class="tag">${e[0]}</span><h3>${e[1]}</h3><p>${e[2]}</p><a href="${APP}#x=${id}&amp;l=${l}" target="_blank" rel="noopener">${t.go}</a></article>`; }).join('');
    $('tools').innerHTML = ['signal', 'speakers', 'medium', 'view'].map(k => `<div class="tool"><b>${t['t_' + k]}</b><span>${t['t_' + k + '_t']}</span></div>`).join('');
    $('keys').innerHTML = [['← →', 'k_freq'], ['P', 'k_pulse'], ['Space', 'k_pause'], ['F', 'k_fit'], ['1–5', 'k_views'], ['C', 'k_cam'], ['M', 'k_mic'], ['?', 'k_help']]
      .map(([k, v]) => `<span><kbd>${k}</kbd> ${t[v]}</span>`).join('');
    try { localStorage.setItem('sfl-guide-lang', l); } catch (e) { /* storage blocked: fine */ }
  }
  let lang = new URLSearchParams(location.hash.slice(1)).get('l');
  if (!T[lang]) { try { lang = localStorage.getItem('sfl-guide-lang'); } catch (e) { lang = null; } }
  if (!T[lang]) lang = (navigator.language || 'en').slice(0, 2);
  if (!T[lang]) lang = 'en';
  document.querySelectorAll('.langs button').forEach(b => b.onclick = () => { lang = b.dataset.l; render(lang); });
  render(lang);

  // ---------------- The hero: molecules around a simple source, moving like in the lab ----------------
  const cv = $('air'), g = cv.getContext('2d'), still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, pts = [];
  function size() {
    const d = Math.min(devicePixelRatio || 1, 2); W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * d; cv.height = H * d; g.setTransform(d, 0, 0, d, 0, 0);
    let seed = 3; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    pts = []; const n = Math.round(W * H / 260); for (let i = 0; i < n; i++) pts.push([r() * W, r() * H]);
  }
  function frame(t) {
    const narrow = W < 700, cx = narrow ? W + 30 : W * 0.78, cy = narrow ? H * 0.32 : H * 0.55, lam = Math.max(70, W / 9), k = 2 * Math.PI / lam, ph = (still ? 0 : t / 1000) * 2 * Math.PI / 2.2;
    g.clearRect(0, 0, W, H);
    for (const [x, y] of pts) {
      const dx = x - cx, dy = y - cy, r = Math.hypot(dx, dy) || 1, a = ph - k * r, fall = Math.max(0.35, Math.sqrt(40 / r));
      const s = 7 * fall * Math.cos(a), p = Math.sin(a);
      g.fillStyle = p > 0 ? '#3ddc84' : '#ff5a52'; g.globalAlpha = 0.18 + 0.7 * Math.abs(p);
      g.beginPath(); g.arc(x + dx / r * s, y + dy / r * s, 1.6, 0, 6.2832); g.fill();
    }
    g.globalAlpha = 1; g.fillStyle = '#ff6b6b'; g.beginPath(); g.arc(cx, cy, 9 + 3 * Math.cos(ph), 0, 6.2832); g.fill();
    if (!still) requestAnimationFrame(frame);
  }
  addEventListener('resize', size); size(); requestAnimationFrame(frame);
})();
</script>
